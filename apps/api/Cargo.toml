[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
